# My Town News — Weekly Content Pipeline
# Runs Friday morning Pacific, so issues land at the top of the day.
#
# Structure: one job per edition, in parallel.
#
# This used to be a single job generating all thirteen editions in sequence.
# On 2026-08-28 that job hit the runner's 60-minute ceiling partway through
# edition ten and was cancelled — nine issues had been written and not one
# newsletter was sent. The duration had been climbing for weeks (36 → 49 →
# 51 → 52 minutes) and nothing flagged it.
#
# Splitting by edition fixes the class of problem rather than the instance:
# each job now handles one edition in about five minutes, so the timeout is
# no longer reachable, and a wedged edition cannot take its neighbors down.
#
# To rehearse without publishing: Actions → Weekly Publish → Run workflow →
# tick "Dry run". Content is generated and the newsletters are rendered, but
# nothing is mailed and nothing is committed. The rendered emails are attached
# to the run as artifacts.

name: Weekly Publish

on:
  schedule:
    # This is when the work STARTS, not when the newsletter lands.
    #
    # Delivery is handled by Buttondown: each email is created with
    # status "scheduled" and a publish_date of 16:30 UTC (SEND_AT_UTC in
    # pipeline/generate-issue.js), so every edition arrives at the same
    # instant no matter when its job finished.
    #
    # Running early is therefore pure slack, and it absorbs the three things
    # that used to move delivery: GitHub queueing a scheduled run under load,
    # an edition needing two or three research attempts, and the spread
    # between the first job finishing and the last.
    #
    # ── Two crons, and neither on the hour ────────────────────────────────
    # On 11 September 2026 the 15:00 run never happened. Not failed, not
    # cancelled, not queued — the Actions list simply had no entry for that
    # Friday, and the first anyone knew was an empty inbox. It was the first
    # Friday this schedule should have fired.
    #
    # GitHub documents that scheduled workflows may be delayed or dropped
    # under load, and the top of the hour is the most contended minute there
    # is. So: move off :00, and stop depending on a single trigger.
    #
    # The second cron is a backstop, not a second edition. The planning job
    # passes --skip-published, which drops any edition whose issue file for
    # this Friday is already committed — so when the primary run worked this
    # costs one planning job and stops. Only genuinely missing editions are
    # generated, and Buttondown's email_duplicate guard catches anything that
    # gets past that.
    - cron: '7 14 * * 5'    # Friday 14:07 UTC — 2h23m before the 16:30 send
    - cron: '23 15 * * 5'   # backstop, 76 minutes later, if the first never ran
  workflow_dispatch:       # Allow manual trigger from GitHub Actions UI
    inputs:
      cluster:
        description: 'Run for a single edition slug (leave blank for all)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run — rehearse fully, mail nobody, commit nothing'
        type: boolean
        default: false
      skip_published:
        description: 'Skip editions already published this week — keeps a re-run cheap'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # ── Which editions are we publishing? ───────────────────────────────────
  # A matrix must be known before any job starts, and GitHub cannot read
  # clusters.json on its own, so this reads it and hands over the list.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      editions: ${{ steps.pick.outputs.editions }}
    steps:
      - uses: actions/checkout@v5

      # A scheduled run always skips what is already published — that is what
      # makes a second cron affordable. A manual run defaults to the same
      # thing so a re-run after a partial failure costs only the editions that
      # actually failed, but the box can be unticked to force a full rebuild.
      #
      # A dry run never skips: it writes nothing to src/content, so "already
      # published" is not a fact about the rehearsal, and a rehearsal that
      # silently planned zero editions would be a confusing way to find out.
      - name: Choose editions
        id: pick
        run: |
          SKIP=""
          if [ "${{ github.event.inputs.dry_run }}" != "true" ] \
             && [ "${{ github.event_name }}" = "schedule" -o "${{ github.event.inputs.skip_published }}" = "true" ]; then
            SKIP="--skip-published"
          fi
          EDITIONS=$(node scripts/list-editions.js "${{ github.event.inputs.cluster }}" $SKIP)
          echo "editions=$EDITIONS" >> "$GITHUB_OUTPUT"
          echo "Publishing: $EDITIONS"

  # ── One edition per job ─────────────────────────────────────────────────
  publish:
    needs: plan
    # An empty list means the backstop found nothing left to do. GitHub errors
    # on a matrix built from [] rather than skipping, so the condition is
    # required, not tidiness.
    if: needs.plan.outputs.editions != '[]'
    runs-on: ubuntu-latest
    # Generous relative to the ~5 minutes an edition takes, but far below the
    # 60-minute ceiling, so a hung edition fails fast and alone.
    timeout-minutes: 25
    strategy:
      # Non-negotiable. With fail-fast on, one edition erroring would cancel
      # every other edition mid-flight — the exact failure this split exists
      # to prevent, reintroduced by a default.
      fail-fast: false
      # Below GitHub Free's 20-concurrent-job cap, and gentle on the Anthropic
      # API. Raise deliberately, watching for rate-limit errors.
      max-parallel: 6
      matrix:
        edition: ${{ fromJSON(needs.plan.outputs.editions) }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      # DRY_RUN must reach the script itself. Until 2026-08-24 this input only
      # gated the commit step, so a "dry run" generated every edition and
      # mailed every subscriber. scripts/verify-build.js asserts this env line
      # still exists so the gap cannot quietly reopen.
      - name: Generate and send ${{ matrix.edition }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: node pipeline/generate-issue.js --cluster ${{ matrix.edition }}

      # Stage into a mirror of the repo layout so the collect job can restore
      # every edition's file to the right place in one merged download.
      - name: Stage output
        if: always()
        run: |
          mkdir -p out/src/content/${{ matrix.edition }}
          cp src/content/${{ matrix.edition }}/*.json \
             out/src/content/${{ matrix.edition }}/ 2>/dev/null || true
          if [ -d pipeline/dry-run ]; then
            mkdir -p out/pipeline
            cp -r pipeline/dry-run out/pipeline/
          fi

      - name: Upload ${{ matrix.edition }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-${{ matrix.edition }}
          path: out/
          if-no-files-found: warn
          retention-days: 14

  # ── Commit everything that succeeded, once ──────────────────────────────
  # Thirteen jobs cannot each push to main without racing, so the writes are
  # collected here. `if: always()` because partial success is the normal case
  # worth publishing — editions that made it should still reach the site.
  collect:
    needs: [plan, publish]
    # always() because partial success is the normal case worth publishing —
    # but not when the backstop planned nothing, where there is no artifact to
    # download and a commit job that runs anyway is just noise in the log.
    if: always() && github.event.inputs.dry_run != 'true' && needs.plan.outputs.editions != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Download every edition
        uses: actions/download-artifact@v5
        with:
          pattern: issue-*
          merge-multiple: true
          path: staging

      - name: Restore issues into the repo
        run: |
          if [ -d staging/src/content ]; then
            cp -r staging/src/content/. src/content/
          fi
          git status --short src/content/ || true

      - name: Build site
        run: npm run build:prod

      - name: Commit new issue files
        run: |
          git config user.name  "mytown-news-bot"
          git config user.email "bot@mytown.news"
          git add src/content/
          WEEK=$(date +%Y-%m-%d)
          git diff --cached --quiet || \
            git commit -m "chore: publish week of ${WEEK}"
          git pull --rebase origin main
          git push
