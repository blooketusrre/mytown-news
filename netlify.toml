[build]
  command   = "npm run build:prod"
  publish   = "_site"

[build.environment]
  NODE_VERSION = "20"

# Clean URLs — /north-waterfront/ instead of /north-waterfront/index.html
[[redirects]]
  from   = "/:path"
  to     = "/:path/"
  status = 301
  conditions = {Path = ["*[^/]", "!*.*"]}

# Civic Center & Hayes Valley was split into two editions on 2026-08-21.
# Civic Center & Tenderloin inherits the archive and the bulk of the audience.
[[redirects]]
  from   = "/civic-center-hayes-valley/*"
  to     = "/civic-center-tenderloin/:splat"
  status = 301
  force  = true


# ── Phase 2: editions moved under their city (2026-08-28) ──────────────────
# Every edition used to live at /<slug>/. They now live at /<city>/<slug>/ so
# that a second city cannot collide with the first, and so search authority
# accumulates on one domain instead of thirteen unrelated top-level paths.
#
# These are permanent: shared links, the Buttondown archive and every issue
# already mailed point at the old URLs. Removing a rule here silently 404s a
# newsletter someone received. scripts/verify-build.js asserts one exists for
# every live edition.

[[redirects]]
  from   = "/north-waterfront/*"
  to     = "/san-francisco/north-waterfront/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "/marina-pacific-heights/*"
  to     = "/san-francisco/marina-pacific-heights/:splat"
